<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDAL Lab 4 Trainer — Weather CSV + Pig, hands-on</title>
<meta name="description" content="Type-to-learn trainer for the BDAL Hadoop labs: cluster startup, HDFS commands (Lab 2) and MapReduce matrix multiplication (Lab 3), in a simulated terminal. Pick your OS and drill the real commands.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F2B705'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%2320262E'%3E%24_%3C/text%3E%3C/svg%3E">
<style>
:root {
  --paper: #F7F5F0;
  --card: #FFFFFF;
  --ink: #20262E;
  --muted: #6A7280;
  --line: #E3DFD5;
  --accent: #F2B705;
  --accent-soft: #FCF3D2;
  --accent-ink: #7A5D00;
  --term-bg: #14181D;
  --term-line: #232A33;
  --term-out: #D7DEE8;
  --term-dim: #8A94A3;
  --ok: #2FA36B;
  --ok-soft: #E2F3EA;
  --err: #E05252;
  --err-soft: #FBE9E9;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }

h1, h2, h3, .display {
  font-family: var(--mono);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

a { color: var(--accent-ink); }

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 10px; border-bottom: 2px solid var(--ink);
  margin-bottom: 20px;
}
.top .brand { font-family: var(--mono); font-weight: 700; font-size: 15px; cursor: pointer; background: none; border: none; color: var(--ink); padding: 0; }
.top .brand .tail { color: var(--accent-ink); }
.oschip {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--ink); border-radius: 999px;
  background: var(--accent); color: var(--ink);
  padding: 4px 12px; cursor: pointer;
}
.oschip:hover { background: #ffd23f; }

/* ---------- OS picker ---------- */
.hero { margin: 40px 0 8px; }
.hero h1 { font-size: 30px; margin: 0 0 6px; }
.hero h1 .cursor { display: inline-block; width: 0.55em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero p { color: var(--muted); margin: 0 0 4px; max-width: 54ch; }
.oslist { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 24px; }
@media (min-width: 560px) { .oslist { grid-template-columns: repeat(3, 1fr); } }
.oscard {
  display: block; width: 100%; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 16px; cursor: pointer; font-family: inherit; font-size: inherit; color: inherit;
}
.oscard:hover, .oscard:focus-visible { border-color: var(--ink); }
.oscard .osname { font-family: var(--mono); font-weight: 700; font-size: 17px; display: block; }
.oscard .osdetail { color: var(--muted); font-size: 13.5px; display: block; margin-top: 4px; }
.oscard .oscmd { font-family: var(--mono); font-size: 12.5px; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; display: inline-block; margin-top: 10px; }

/* ---------- home ---------- */
.modlist { display: grid; gap: 14px; }
.modcard {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 16px 16px 14px;
}
.modcard h2 { font-size: 17px; margin: 0 0 2px; }
.modcard .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.modnum { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; display: inline-block; margin-bottom: 8px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font-family: var(--mono); font-size: 13.5px; font-weight: 600;
  border: 1.5px solid var(--ink); border-radius: 8px;
  background: var(--ink); color: #fff; padding: 8px 14px; cursor: pointer;
}
.btn:hover { background: #3a4250; border-color: #3a4250; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.done { color: var(--ok); font-weight: 700; }
.lockhint { color: var(--muted); font-size: 13px; margin-top: 6px; }
.footer { margin-top: 32px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
.footer button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12.5px; padding: 0; }

/* ---------- step screen ---------- */
.runhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.runhead .runtitle { font-family: var(--mono); font-weight: 700; font-size: 14px; }
.runhead .count { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }

.theory {
  background: var(--card); border-left: 4px solid var(--accent);
  border-radius: 0 10px 10px 0; padding: 10px 14px; margin-bottom: 12px;
  font-size: 14.5px;
}
.note {
  background: var(--ok-soft); border-left: 4px solid var(--ok);
  border-radius: 0 10px 10px 0; padding: 8px 14px; margin-bottom: 12px; font-size: 13.5px;
}
.question { font-size: 16.5px; font-weight: 650; margin: 0 0 12px; }
.question .qlabel { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent-ink); text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 2px; }

/* ---------- anatomy (first-encounter teaching) ---------- */
.anatomy {
  background: var(--card); border: 1.5px dashed var(--accent);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
}
.anatomy .alabel {
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent-ink);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
}
.anatomy .arow { display: grid; grid-template-columns: minmax(72px, auto) 1fr; gap: 4px 10px; align-items: baseline; padding: 3px 0; }
.anatomy .arow code {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  background: var(--accent-soft); border-radius: 6px; padding: 1px 8px;
  justify-self: start; word-break: break-all;
}
.anatomy .arow span { font-size: 13.5px; color: var(--muted); }

/* ---------- terminal ---------- */
.term {
  background: var(--term-bg); border-radius: 12px; overflow: hidden;
  border: 1.5px solid var(--term-line);
}
.term .tbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--term-line); }
.term .tbar .dot { width: 10px; height: 10px; border-radius: 50%; background: #46505c; }
.term .tbar .tname { font-family: var(--mono); font-size: 11.5px; color: var(--term-dim); margin-left: 6px; }
.scrollback {
  font-family: var(--mono); font-size: 13px; line-height: 1.45;
  color: var(--term-out); padding: 12px 14px 4px;
  max-height: 40vh; min-height: 90px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
}
.scrollback .in { color: #fff; }
.scrollback .in .pr { color: var(--accent); }
.scrollback .out { color: var(--term-dim); }
.scrollback .bad { color: var(--err); }
.scrollback .good { color: var(--ok); font-weight: 700; }
.inline-input { display: flex; align-items: center; gap: 8px; padding: 6px 14px 12px; }
.inline-input .pr { font-family: var(--mono); font-size: 13px; color: var(--accent); white-space: nowrap; }
.inline-input input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--mono); font-size: 16px; color: #fff; caret-color: var(--accent);
  padding: 6px 0; min-width: 0;
}

.stepactions { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.hintbox {
  background: var(--accent-soft); border-left: 4px solid var(--accent);
  border-radius: 0 10px 10px 0; padding: 8px 14px; margin-top: 12px; font-size: 14px;
}
.hintbox code, .theory code, .note code { font-family: var(--mono); font-size: 0.92em; background: rgba(0,0,0,0.06); border-radius: 4px; padding: 0 4px; }
.tally { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }

/* ---------- summary ---------- */
.summary { text-align: center; padding: 40px 0; }
.summary h2 { font-size: 24px; }
.summary .big { font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--accent-ink); }
.summary p { color: var(--muted); }

/* ---------- test mode ---------- */
.testlog { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: var(--card); border-radius: 10px; padding: 14px; }
.testlog .p { color: var(--ok); }
.testlog .f { color: var(--err); }

:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- guide view ---------- */
.guide { margin-top: 8px; }
.glabel { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent-ink); text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
.gstep { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
.gnum { font-family: var(--mono); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.gcmd { display: flex; align-items: stretch; border-radius: 8px; overflow: hidden; border: 1px solid #2a3038; margin: 10px 0; }
.gcmd code { flex: 1; background: var(--term-bg, #14181D); color: #d8dee6; padding: 9px 12px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.gcmd code::before { content: "$ "; color: var(--accent); font-weight: 700; }
.gcmd .copybtn { border: 0; background: #232a33; color: #d8dee6; cursor: pointer; padding: 0 14px; font-family: var(--mono); font-size: 12px; min-width: 64px; }
.gcmd .copybtn:active { background: var(--accent); color: #000; }
.gout { background: var(--term-bg, #14181D); color: #9fe3b8; border-radius: 8px; padding: 9px 12px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-x: auto; max-height: 300px; overflow-y: auto; margin-top: 8px; }
.gout .glabel { color: #8b949e; }
.outcome { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: 14.5px; }
.trouble { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 16px; margin: 16px 0; }
.trow { border-top: 1px solid var(--line); padding: 8px 0; }
.trow:first-of-type { border-top: none; }
.terr { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--bad, #B3261E); }
.tfix { font-size: 13.5px; color: var(--ink); margin-top: 3px; }
.guide-actions { margin: 20px 0 40px; }

/* ---------- blog layout ---------- */
.blog-hero { margin: 28px 0 4px; }
.blog-hero p { max-width: 62ch; }
.howto { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 18px 0; }
.howto ol { margin: 4px 0 0; padding-left: 20px; }
.howto li { margin: 6px 0; font-size: 14.5px; }
.toc { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 12px 18px; margin: 14px 0 8px; }
.toc a { font-family: var(--mono); font-size: 13.5px; color: var(--ink); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
.blogsec { border-top: 2px solid var(--ink); margin-top: 40px; padding-top: 10px; }
.blogsec > h2 { font-size: 22px; margin: 8px 0 12px; }
.blogsec > h2 .modnum { vertical-align: middle; margin-right: 6px; }
.adapt { background: #FFF6DD; border: 1px solid #EDDCA8; border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13.5px; }
.adapt .glabel { color: #8a6d00; }
.expectbox { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0 2px; font-size: 13.5px; color: var(--ink); }
.aibox { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 16px; margin: 16px 0; }
.aibox pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--paper); border-radius: 8px; padding: 10px 12px; margin: 8px 0; max-height: 220px; overflow-y: auto; }
.secactions { margin: 14px 0 6px; }
.practicelead { color: var(--muted); max-width: 62ch; }

</style>

<body>
<div id="app"></div>
<script>
/* BDAL Lab 4 Trainer — simulator engine (pure, no DOM).
 * Works in browser (globalThis.BDALEngine) and node (module.exports). */
(function (root) {
'use strict';

var WARN = 'WARN util.NativeCodeLoader: Unable to load native-hadoop library for your platform... using builtin-java classes where applicable';

var WEATHER_CSV = [
  '2025-03-01, 32, 55, Clear', '2025-03-02, 28, 60, Partly Cloudy', '2025-03-03, 15, 70, Rain',
  '2025-03-04, 10, 75, Rain', '2025-03-05, 5, 80, Snow', '2025-03-06, 35, 50, Sunny',
  '2025-03-07, 38, 45, Heatwave', '2025-03-08, 12, 65, Cloudy', '2025-03-09, 8, 85, Snow',
  '2025-03-10, 25, 58, Clear', '2025-03-11, 20, 63, Drizzle', '2025-03-12, 30, 55, Sunny',
  '2025-03-13, 28, 57, Clear', '2025-03-14, 22, 60, Cloudy', '2025-03-15, 18, 67, Rain',
  '2025-03-16, 12, 70, Storm', '2025-03-17, 5, 90, Snow', '2025-03-18, 7, 80, Snow',
  '2025-03-19, 14, 75, Foggy', '2025-03-20, 30, 50, Sunny', '2025-03-21, 33, 45, Clear',
  '2025-03-22, 40, 40, Heatwave', '2025-03-23, 10, 80, Rain', '2025-03-24, 6, 85, Snow',
  '2025-03-25, 15, 70, Rain', '2025-03-26, 22, 65, Partly Cloudy', '2025-03-27, 35, 55, Clear',
  '2025-03-28, 18, 60, Drizzle', '2025-03-29, 25, 58, Cloudy', '2025-03-30, 30, 52, Sunny',
  '2025-03-31, 12, 75, Thunderstorm'
].join('\n');

var JAVA_SRC = '// WeatherDataProcessor.java — Mapper classifies each day, Reducer passes through (see lab folder)';

var STUDENTS_CSV = '1,John,18,A\n2,Alice,19,B\n3,Bob,17,A\n4,David,20,B';
var SCORES_CSV = '1,Math,85\n2,Math,78\n3,Science,90\n4,Math,88';
var SCRIPT_PIG = [
  "students = LOAD 'students.csv' USING PigStorage(',')",
  '    AS (student_id:int, name:chararray, age:int, grade:chararray);',
  '',
  "scores = LOAD 'scores.csv' USING PigStorage(',')",
  '    AS (student_id:int, subject:chararray, score:int);',
  '',
  'filtered_students = FILTER students BY age > 18;',
  'projected_students = FOREACH filtered_students GENERATE name, grade;',
  'sorted_students = ORDER projected_students BY name ASC;',
  'grouped_scores = GROUP scores BY subject;',
  'joined_data = JOIN students BY student_id, scores BY student_id;',
  '',
  'DUMP sorted_students;',
  'DUMP grouped_scores;',
  'DUMP joined_data;'
].join('\n');

function dir(children) { return { type: 'dir', children: children || {} }; }
function file(content) { return { type: 'file', content: content || '' }; }

function createState(os) {
  var local = dir();
  var cwd;
  if (os === 'windows') {
    local.children['C:'] = dir({
      BDA: dir({
        'command3.txt': file('this file moves into hdfs'),
        'exampleput.txt': file('uploaded with put'),
        'Weather.csv': file(WEATHER_CSV),
        'WeatherDataProcessor.java': file(JAVA_SRC)
      }),
      piglab: dir({
        'students.csv': file(STUDENTS_CSV),
        'scores.csv': file(SCORES_CSV),
        'script.pig': file(SCRIPT_PIG)
      })
    });
    cwd = ['C:', 'BDA'];
  } else {
    local.children['~'] = dir({
      kit: dir({
        'Lab-2-HDFS-Basic-Commands': dir({
          'command3.txt': file('this file moves into hdfs'),
          'exampleput.txt': file('uploaded with put')
        })
      }),
      weather: dir({
        'WeatherDataProcessor.java': file(JAVA_SRC),
        'Weather.csv': file(WEATHER_CSV)
      }),
      piglab: dir({
        'students.csv': file(STUDENTS_CSV),
        'scores.csv': file(SCORES_CSV),
        'script.pig': file(SCRIPT_PIG)
      })
    });
    cwd = ['~'];
  }
  return {
    os: os,
    clusterUp: false,
    hdfs: dir({ tmp: dir(), user: dir() }),
    local: local,
    cwd: cwd,
    compiled: false,
    jarBuilt: false,
    jobRuns: 0,
    pids: null,
    pidSeed: 4100
  };
}

// ---------- helpers ----------

function tokenize(input) {
  var tokens = [], cur = '', q = null;
  for (var i = 0; i < input.length; i++) {
    var c = input[i];
    if (q) {
      if (c === q) { q = null; } else { cur += c; }
    } else if (c === '"' || c === "'") {
      q = c;
    } else if (/\s/.test(c)) {
      if (cur) { tokens.push(cur); cur = ''; }
    } else {
      cur += c;
    }
  }
  if (cur) tokens.push(cur);
  return tokens;
}

function ok(output) { return { output: output, ok: true }; }
function err(output) { return { output: output, ok: false }; }

function isUnix(state) { return state.os !== 'windows'; }

// local path -> array of segments from local root, or null if malformed
function localSegs(state, p) {
  p = p.replace(/\\/g, '/');
  var segs;
  if (/^[A-Za-z]:/.test(p)) {
    segs = p.split('/').filter(Boolean);
    segs[0] = segs[0].toUpperCase();
  } else if (p === '~' || p.indexOf('~/') === 0) {
    segs = ['~'].concat(p.slice(2).split('/').filter(Boolean));
  } else if (p.indexOf('/') === 0) {
    // absolute unix path — map /home-ish onto '~' root for simplicity
    segs = ['~'].concat(p.split('/').filter(Boolean));
  } else {
    segs = state.cwd.concat(p.split('/').filter(Boolean));
  }
  var out = [];
  for (var i = 0; i < segs.length; i++) {
    if (segs[i] === '.') continue;
    else if (segs[i] === '..') out.pop();
    else out.push(segs[i]);
  }
  return out;
}

function getNode(rootDir, segs) {
  var node = rootDir;
  for (var i = 0; i < segs.length; i++) {
    if (!node || node.type !== 'dir') return null;
    node = node.children[segs[i]];
  }
  return node || null;
}

function hdfsSegs(p) {
  if (p.indexOf('/') !== 0) p = '/user/student/' + p;
  return p.split('/').filter(Boolean);
}

function hdfsPathStr(segs) { return '/' + segs.join('/'); }

function cwdString(state) {
  if (isUnix(state)) return state.cwd.join('/');
  return state.cwd[0] + '\\' + state.cwd.slice(1).join('\\');
}

// ---------- cluster ----------

var UNIX_DAEMONS = ['NameNode', 'DataNode', 'SecondaryNameNode', 'ResourceManager', 'NodeManager'];
var WIN_DAEMONS = ['NameNode', 'DataNode', 'ResourceManager', 'NodeManager'];

function startCluster(state) {
  if (state.clusterUp) return ok('cluster is already running (check with: jps)');
  state.clusterUp = true;
  var daemons = isUnix(state) ? UNIX_DAEMONS : WIN_DAEMONS;
  state.pids = {};
  var pid = state.pidSeed;
  for (var i = 0; i < daemons.length; i++) {
    pid += 137 + i * 11;
    state.pids[daemons[i]] = pid;
  }
  if (isUnix(state)) {
    return ok('Starting namenodes on [localhost]\nStarting datanodes\nStarting secondary namenodes [localhost]\nStarting resourcemanager\nStarting nodemanagers');
  }
  return ok('starting namenode, logging to console window\nstarting datanode, logging to console window\nstarting yarn daemons\n(4 new console windows opened — leave them open, closing one kills that daemon)');
}

function stopCluster(state) {
  if (!state.clusterUp) return ok('cluster is not running');
  state.clusterUp = false;
  state.pids = null;
  return ok(isUnix(state)
    ? 'Stopping namenodes on [localhost]\nStopping datanodes\nStopping secondary namenodes [localhost]\nStopping resourcemanager\nStopping nodemanagers'
    : 'stopping namenode\nstopping datanode\nstopping yarn daemons');
}

function jps(state) {
  state.pidSeed += 7;
  var lines = [];
  if (state.clusterUp) {
    var names = Object.keys(state.pids);
    for (var i = 0; i < names.length; i++) lines.push(state.pids[names[i]] + ' ' + names[i]);
  }
  lines.push((state.pidSeed + 900) + ' Jps');
  return ok(lines.join('\n'));
}

// ---------- fs (hadoop fs / hdfs dfs) ----------

function connRefused(verb) {
  return err(verb + ': Call From localhost to localhost:9000 failed on connection exception: ' +
    'java.net.ConnectException: Connection refused; For more details see:  http://wiki.apache.org/hadoop/ConnectionRefused\n' +
    '(hint: the cluster is not running — nothing is broken)');
}

function lsEntryLine(name, node, pathPrefix) {
  var full = (pathPrefix === '/' ? '' : pathPrefix) + '/' + name;
  if (node.type === 'dir') {
    return 'drwxr-xr-x   - student supergroup          0 2026-07-28 10:00 ' + full;
  }
  var size = String(node.content.length);
  var pad = '';
  for (var i = size.length; i < 10; i++) pad += ' ';
  return '-rw-r--r--   1 student supergroup ' + pad + size + ' 2026-07-28 10:00 ' + full;
}

function fsCmd(state, args, family) {
  if (!args.length) return err('Usage: ' + family + ' -<command> [args]');
  var sub = args[0];
  var verb = sub.replace(/^-+/, '');
  if (!state.clusterUp) {
    var known = ['-ls', '-mkdir', '-copyFromLocal', '-put', '-copyToLocal', '-get', '-cat', '-rm', '-rmdir',
      '-mv', '-cp', '-du', '-tail', '-touchz', '-count'];
    if (known.indexOf(sub) !== -1) return connRefused(verb);
  }
  var rest = args.slice(1);
  switch (sub) {
    case '-ls': return fsLs(state, rest);
    case '-mkdir': return fsMkdir(state, rest);
    case '-copyFromLocal':
    case '-put': return fsPut(state, rest, verb);
    case '-copyToLocal':
    case '-get': return fsGet(state, rest, verb);
    case '-cat': return fsCat(state, rest);
    case '-rm': return fsRm(state, rest);
    case '-rmdir': return fsRmdir(state, rest);
    case '-mv':
    case '-cp': return fsMvCp(state, rest, verb);
    case '-du': return fsDu(state, rest);
    case '-tail': return fsTail(state, rest);
    case '-touchz': return fsTouchz(state, rest);
    case '-count': return fsCount(state, rest);
    default:
      return err(sub + ': Unknown command');
  }
}

function cloneNode(node) { return JSON.parse(JSON.stringify(node)); }

function fsMvCp(state, rest, verb) {
  var fp = flagsAndPaths(rest);
  if (fp.paths.length < 2) return err('-' + verb + ': Not enough arguments');
  var srcSegs = hdfsSegs(fp.paths[0]);
  var srcNode = getNode(state.hdfs, srcSegs);
  if (!srcNode) return err(verb + ': `' + hdfsPathStr(srcSegs) + "': No such file or directory");
  var dstSegs = hdfsSegs(fp.paths[1]);
  var dstNode = getNode(state.hdfs, dstSegs);
  var parent, finalName;
  if (dstNode && dstNode.type === 'dir') { parent = dstNode; finalName = srcSegs[srcSegs.length - 1]; }
  else if (dstNode) { return err(verb + ': `' + hdfsPathStr(dstSegs) + "': File exists"); }
  else {
    parent = getNode(state.hdfs, dstSegs.slice(0, -1));
    if (!parent || parent.type !== 'dir') return err(verb + ': `' + hdfsPathStr(dstSegs) + "': No such file or directory");
    finalName = dstSegs[dstSegs.length - 1];
  }
  parent.children[finalName] = cloneNode(srcNode);
  if (verb === 'mv') {
    var srcParent = getNode(state.hdfs, srcSegs.slice(0, -1));
    delete srcParent.children[srcSegs[srcSegs.length - 1]];
  }
  return ok(WARN);
}

function sumSize(node) {
  if (node.type === 'file') return node.content.length;
  var total = 0;
  for (var k in node.children) total += sumSize(node.children[k]);
  return total;
}

function humanSize(n) {
  if (n < 1024) return String(n);
  return (n / 1024).toFixed(1) + ' K';
}

function fsDu(state, rest) {
  var fp = flagsAndPaths(rest);
  var human = fp.flags.indexOf('-h') !== -1;
  var p = fp.paths[0] || '/user/student';
  var segs = hdfsSegs(p);
  var node = getNode(state.hdfs, segs);
  if (!node) return err('du: `' + hdfsPathStr(segs) + "': No such file or directory");
  var out = [WARN];
  var entries = node.type === 'dir' ? Object.keys(node.children).sort() : [null];
  for (var i = 0; i < entries.length; i++) {
    var child = entries[i] === null ? node : node.children[entries[i]];
    var full = entries[i] === null ? hdfsPathStr(segs) : hdfsPathStr(segs) + '/' + entries[i];
    var size = sumSize(child);
    var shown = human ? humanSize(size) : String(size);
    out.push(shown + '  ' + shown + '  ' + full);
  }
  return ok(out.join('\n'));
}

function fsTail(state, rest) {
  var fp = flagsAndPaths(rest);
  if (!fp.paths.length) return err('-tail: Not enough arguments');
  var segs = hdfsSegs(fp.paths[0]);
  var node = getNode(state.hdfs, segs);
  if (!node) return err('tail: `' + hdfsPathStr(segs) + "': No such file or directory");
  if (node.type === 'dir') return err('tail: `' + hdfsPathStr(segs) + "': Is a directory");
  var content = node.content;
  var tail = content.length > 1024 ? content.slice(content.length - 1024) : content;
  return ok(WARN + '\n' + tail);
}

function fsTouchz(state, rest) {
  var fp = flagsAndPaths(rest);
  if (!fp.paths.length) return err('-touchz: Not enough arguments');
  var segs = hdfsSegs(fp.paths[0]);
  var existing = getNode(state.hdfs, segs);
  if (existing && existing.type === 'dir') return err('touchz: `' + hdfsPathStr(segs) + "': Is a directory");
  var parent = getNode(state.hdfs, segs.slice(0, -1));
  if (!parent || parent.type !== 'dir') return err('touchz: `' + hdfsPathStr(segs) + "': No such file or directory");
  parent.children[segs[segs.length - 1]] = file('');
  return ok(WARN);
}

function countDirs(node) {
  if (node.type !== 'dir') return 0;
  var n = 1;
  for (var k in node.children) n += countDirs(node.children[k]);
  return n;
}
function countFiles(node) {
  if (node.type === 'file') return 1;
  var n = 0;
  for (var k in node.children) n += countFiles(node.children[k]);
  return n;
}

function fsCount(state, rest) {
  var fp = flagsAndPaths(rest);
  var p = fp.paths[0] || '/user/student';
  var segs = hdfsSegs(p);
  var node = getNode(state.hdfs, segs);
  if (!node) return err('count: `' + hdfsPathStr(segs) + "': No such file or directory");
  return ok(WARN + '\n' +
    '           ' + countDirs(node) + '            ' + countFiles(node) + '                 ' + sumSize(node) + ' ' + hdfsPathStr(segs));
}

function flagsAndPaths(rest) {
  var flags = [], paths = [];
  for (var i = 0; i < rest.length; i++) {
    if (rest[i].indexOf('-') === 0 && !/^-?\/|^-?[A-Za-z]:/.test(rest[i])) flags.push(rest[i]);
    else paths.push(rest[i]);
  }
  return { flags: flags, paths: paths };
}

function fsMkdir(state, rest) {
  var fp = flagsAndPaths(rest);
  if (!fp.paths.length) return err('-mkdir: Not enough arguments');
  var withP = fp.flags.indexOf('-p') !== -1;
  for (var i = 0; i < fp.paths.length; i++) {
    var segs = hdfsSegs(fp.paths[i]);
    var shown = hdfsPathStr(segs);
    if (getNode(state.hdfs, segs)) return err('mkdir: `' + shown + "': File exists");
    var parent = getNode(state.hdfs, segs.slice(0, -1));
    if (!parent || parent.type !== 'dir') {
      if (!withP) return err('mkdir: `' + shown + "': No such file or directory");
      parent = state.hdfs;
      for (var j = 0; j < segs.length - 1; j++) {
        if (!parent.children[segs[j]]) parent.children[segs[j]] = dir();
        parent = parent.children[segs[j]];
      }
    }
    parent.children[segs[segs.length - 1]] = dir();
  }
  return ok(WARN);
}

function fsPut(state, rest, verb) {
  var fp = flagsAndPaths(rest);
  var force = fp.flags.indexOf('-f') !== -1;
  if (fp.paths.length < 2) return err('-' + verb + ': Not enough arguments');
  var srcPath = fp.paths[0], dstPath = fp.paths[1];
  if (/\s/.test(srcPath)) return err(verb + ': unexpected URISyntaxException');
  var srcSegs = localSegs(state, srcPath);
  var srcNode = getNode(state.local, srcSegs);
  if (!srcNode || srcNode.type !== 'file') {
    return err(verb + ": `" + srcPath + "': No such file or directory");
  }
  var name = srcSegs[srcSegs.length - 1];
  var dstSegs = hdfsSegs(dstPath);
  var dstNode = getNode(state.hdfs, dstSegs);
  var parent, finalName;
  if (dstNode && dstNode.type === 'dir') { parent = dstNode; finalName = name; }
  else if (dstNode && dstNode.type === 'file') {
    if (!force) return err(verb + ': `' + hdfsPathStr(dstSegs) + "': File exists");
    parent = getNode(state.hdfs, dstSegs.slice(0, -1)); finalName = dstSegs[dstSegs.length - 1];
  } else {
    parent = getNode(state.hdfs, dstSegs.slice(0, -1));
    if (!parent || parent.type !== 'dir') return err(verb + ': `' + hdfsPathStr(dstSegs) + "': No such file or directory");
    finalName = dstSegs[dstSegs.length - 1];
  }
  if (parent.children[finalName] && !force) {
    return err(verb + ': `' + hdfsPathStr(dstSegs) + '/' + finalName + "': File exists");
  }
  parent.children[finalName] = file(srcNode.content);
  return ok(WARN);
}

function fsGet(state, rest, verb) {
  var fp = flagsAndPaths(rest);
  if (fp.paths.length < 2) return err('-' + verb + ': Not enough arguments');
  var srcSegs = hdfsSegs(fp.paths[0]);
  var srcNode = getNode(state.hdfs, srcSegs);
  var errVerb = verb === 'copyToLocal' ? 'copyToLocal' : 'get';
  if (!srcNode || srcNode.type !== 'file') {
    return err(errVerb + ': `' + hdfsPathStr(srcSegs) + "': No such file or directory");
  }
  var name = srcSegs[srcSegs.length - 1];
  var dstPath = fp.paths[1];
  var dstSegs = localSegs(state, dstPath === '.' ? '.' : dstPath);
  var dstNode = getNode(state.local, dstSegs);
  var parent, finalName;
  if (dstNode && dstNode.type === 'dir') { parent = dstNode; finalName = name; }
  else {
    parent = getNode(state.local, dstSegs.slice(0, -1));
    if (!parent || parent.type !== 'dir') return err(errVerb + ': `' + dstPath + "': No such file or directory");
    finalName = dstSegs[dstSegs.length - 1];
  }
  parent.children[finalName] = file(srcNode.content);
  return ok(WARN);
}

function fsCat(state, rest) {
  var fp = flagsAndPaths(rest);
  if (!fp.paths.length) return err('-cat: Not enough arguments');
  var out = [WARN];
  for (var i = 0; i < fp.paths.length; i++) {
    var segs = hdfsSegs(fp.paths[i]);
    var node = getNode(state.hdfs, segs);
    if (!node) return err('cat: `' + hdfsPathStr(segs) + "': No such file or directory");
    if (node.type === 'dir') return err('cat: `' + hdfsPathStr(segs) + "': Is a directory");
    out.push(node.content);
  }
  return ok(out.join('\n'));
}

function fsRm(state, rest) {
  var fp = flagsAndPaths(rest);
  var recursive = fp.flags.indexOf('-r') !== -1 || fp.flags.indexOf('-R') !== -1;
  if (!fp.paths.length) return err('-rm: Not enough arguments');
  var out = [WARN];
  for (var i = 0; i < fp.paths.length; i++) {
    var segs = hdfsSegs(fp.paths[i]);
    var shown = hdfsPathStr(segs);
    var node = getNode(state.hdfs, segs);
    if (!node) return err('rm: `' + shown + "': No such file or directory");
    if (node.type === 'dir' && !recursive) return err('rm: `' + shown + "': Is a directory");
    var parent = getNode(state.hdfs, segs.slice(0, -1));
    delete parent.children[segs[segs.length - 1]];
    out.push('Deleted ' + shown);
  }
  return ok(out.join('\n'));
}

function fsRmdir(state, rest) {
  var fp = flagsAndPaths(rest);
  if (!fp.paths.length) return err('-rmdir: Not enough arguments');
  var segs = hdfsSegs(fp.paths[0]);
  var shown = hdfsPathStr(segs);
  var node = getNode(state.hdfs, segs);
  if (!node) return err('rmdir: `' + shown + "': No such file or directory");
  if (node.type !== 'dir') return err('rmdir: `' + shown + "': Is not a directory");
  if (Object.keys(node.children).length) return err('rmdir: `' + shown + "': Directory is not empty");
  var parent = getNode(state.hdfs, segs.slice(0, -1));
  delete parent.children[segs[segs.length - 1]];
  return ok(WARN);
}

function fsLs(state, rest) {
  var p = rest.filter(function (a) { return a.indexOf('-') !== 0; })[0] || '/user/student';
  var segs = hdfsSegs(p);
  var node = getNode(state.hdfs, segs);
  var shown = hdfsPathStr(segs);
  if (!node) return err('ls: `' + shown + "': No such file or directory");
  var out = [WARN];
  if (node.type === 'file') {
    out.push(lsEntryLine(segs[segs.length - 1], node, hdfsPathStr(segs.slice(0, -1)) || '/'));
    return ok(out.join('\n'));
  }
  var names = Object.keys(node.children).sort();
  out.push('Found ' + names.length + ' items');
  for (var i = 0; i < names.length; i++) {
    out.push(lsEntryLine(names[i], node.children[names[i]], shown === '/' ? '/' : shown));
  }
  return ok(out.join('\n'));
}

function localLs(state) {
  var node = getNode(state.local, state.cwd);
  var names = Object.keys(node.children).sort();

}

function localCd(state, p) {
  if (!p) { state.cwd = isUnix(state) ? ['~'] : ['C:', 'BDA']; return ok(''); }
  var segs = localSegs(state, p);
  var node = getNode(state.local, segs);
  if (!node || node.type !== 'dir') return err('cd: no such file or directory: ' + p);
  state.cwd = segs;
  return ok('');
}

function localMkdir(state, args) {
  var paths = args.filter(function (a) { return a.indexOf('-') !== 0; });
  if (!paths.length) return err('mkdir: missing operand');
  for (var i = 0; i < paths.length; i++) {
    var segs = localSegs(state, paths[i]);
    var parent = getNode(state.local, segs.slice(0, -1));
    if (!parent || parent.type !== 'dir') {
      if (args.indexOf('-p') === -1) return err('mkdir: cannot create directory ‘' + paths[i] + '’: No such file or directory');
      // -p: create the chain
      parent = state.local;
      for (var j = 0; j < segs.length - 1; j++) {
        if (!parent.children[segs[j]]) parent.children[segs[j]] = dir();
        parent = parent.children[segs[j]];
      }
    }
    if (!parent.children[segs[segs.length - 1]]) parent.children[segs[segs.length - 1]] = dir();
  }
  return ok('');
}

      lines.push('', '```', cmd, '```');
      if (step.adapt) lines.push('', '**Adapt it (what to change / what not to touch):** ' + step.adapt);
      if (result.output) lines.push('', 'Expected output:', '', '```', result.output, '```');
      if (step.expect) lines.push('', '**What to expect / not expect:** ' + step.expect);
    });
    if (m.outcome) lines.push('', '**Outcome — how you know it worked:** ' + m.outcome);
    if (m.troubleshooting) {

// ---------- persistence ----------

function loadJSON(key, fallback) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ }
}
function getOS() { return loadJSON('bdal4.os', null); }
function setOS(os) { saveJSON('bdal4.os', os); }
function getProgress() {
  var os = getOS();
  var all = loadJSON('bdal4.progress', {});
  return all[os] || { examBest: null };
}
function setProgress(p) {
  var os = getOS();
  var all = loadJSON('bdal4.progress', {});
  all[os] = p;
  saveJSON('bdal4.progress', all);
}

// ---------- tiny dom helpers ----------

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function md(s) { // backtick -> code
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
}

function promptFor(state) {
  if (state.os === 'windows') return engine.cwdString(state) + '>';
  return 'student@' + (state.os === 'mac' ? 'mac' : 'linux') + ':' + engine.cwdString(state) + '$ ';
}

// ---------- clipboard helpers ----------

function copyText(text, btn, doneLabel) {
  function done() {
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = doneLabel || '\u2713 copied';
    setTimeout(function () { btn.textContent = old; }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* nothing */ }
  document.body.removeChild(ta);
}

// ---------- run (guided / recap / exam / sandbox) ----------

var session = null;

function startRun(kind, mod) {
  var os = getOS();
  var state, steps, title;
  if (kind === 'guided') { state = mod.setup(engine, os); steps = mod.steps; title = mod.title; }
  else if (kind === 'recap') { state = mod.setup(engine, os); steps = lessons.buildRecap(mod); title = mod.title + ' — recap'; }
  else if (kind === 'exam') { state = lessons.examSetup(engine, os); steps = lessons.buildExam(); title = 'Exam mode'; }
  else { state = engine.createState(os); steps = []; title = 'Sandbox'; }
  session = {
    kind: kind, mod: mod, steps: steps, i: 0, state: state, title: title,
    attempts: 0, hintLevel: 0, firstTry: 0, lines: []
  };
  if (kind === 'sandbox') {
    session.lines.push({ cls: 'out', text: 'Free play. The cluster is NOT running yet — you know what to do.\nType commands like in the real lab. (This is a simulator; nothing can break.)' });
  }
  renderStep();
}

function currentStep() { return session.steps[session.i]; }

function scrollbackHTML() {
  return session.lines.map(function (l) {
    if (l.cls === 'in') return '<div class="in"><span class="pr">' + esc(l.prompt) + '</span>' + esc(l.text) + '</div>';
    return '<div class="' + l.cls + '">' + esc(l.text) + '</div>';
  }).join('');
}

function renderStep() {
  var s = session;
  var step = currentStep();
  var os = getOS();
  var total = s.steps.length;
  var isSandbox = s.kind === 'sandbox';
  var pct = total ? Math.round((s.i / total) * 100) : 0;

  var head = '<div class="runhead"><span class="runtitle">' + esc(s.title) + '</span>' +
    (isSandbox ? '' : '<span class="count">step ' + (s.i + 1) + ' / ' + total + '</span>') + '</div>' +
    (isSandbox ? '' : '<div class="bar"><div style="width:' + pct + '%"></div></div>');

  var body = '';
  if (!isSandbox && step) {
    if (step.theory) body += '<div class="theory">' + md(step.theory) + '</div>';
    if (step.note) body += '<div class="note">' + md(step.note) + '</div>';
    body += '<p class="question"><span class="qlabel">your task</span>' + md(step.question) + '</p>';
    if (step.anatomy) {
      var rows = step.anatomy(os).map(function (r) {
        return '<div class="arow"><code>' + esc(r[0]) + '</code><span>' + esc(r[1]) + '</span></div>';
      }).join('');
      body += '<div class="anatomy"><div class="alabel">build it word by word — then type the whole thing</div>' + rows + '</div>';
    }
  }

  var hintHTML = '';
  if (!isSandbox && step && s.hintLevel > 0) {
    var h = s.hintLevel === 1 ? step.hints[0]
      : s.hintLevel === 2 ? step.hints[1]
      : 'Answer: `' + step.answer(os) + '` — now type it yourself.';
    hintHTML = '<div class="hintbox">' + md(h) + '</div>';
  }

  var hintBtn = '';
  if (!isSandbox && step) {
    var locked = step.examMode && s.attempts < 2 && s.hintLevel === 0;
    var label = s.hintLevel === 0 ? 'Hint' : s.hintLevel === 1 ? 'Another hint' : s.hintLevel === 2 ? 'Reveal answer' : 'Answer shown';
    hintBtn = '<div class="stepactions">' +
      '<button class="btn ghost" id="hint-btn" ' + ((locked || s.hintLevel >= 3) ? 'disabled' : '') + '>' +
      (locked ? 'Hints after 2 tries (exam!)' : label) + '</button>' +
      '<button class="btn ghost" id="skip-btn" title="Show the answer and move on">Skip →</button>' +
      '<button class="btn ghost" id="quit-btn">Exit</button>' +
      '<span class="tally">' + (s.attempts ? 'attempts: ' + s.attempts : '') + '</span>' +
      '</div>';
  } else {
    hintBtn = '<div class="stepactions"><button class="btn ghost" id="quit-btn">Back to menu</button></div>';
  }

  app.innerHTML = headerHTML() + head + body +
    '<div class="term">' +
    '<div class="tbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
    '<span class="tname">simulated ' + esc(OS_META[os].name) + ' terminal</span></div>' +
    '<div class="scrollback" id="scrollback">' + scrollbackHTML() + '</div>' +
    '<div class="inline-input"><span class="pr" id="pr"></span>' +
    '<input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ' +
    'aria-label="Type a command and press Enter" placeholder="type the command, press Enter"></div>' +
    '</div>' +
    hintHTML + hintBtn;

  bindHeader();
  document.getElementById('pr').textContent = promptFor(s.state);
  var input = document.getElementById('cmd');
  input.focus();
  var sb = document.getElementById('scrollback');
  sb.scrollTop = sb.scrollHeight;

  var hb = document.getElementById('hint-btn');
  if (hb) hb.onclick = function () { s.hintLevel = Math.min(s.hintLevel + 1, 3); renderStep(); };
  var sk = document.getElementById('skip-btn');
  if (sk) sk.onclick = function () {
    var st = currentStep();
    var ans = st.answer(getOS());
    // run the canonical answer so later steps still line up
    s.lines.push({ cls: 'in', prompt: promptFor(s.state), text: ans });
    var result = engine.runCommand(s.state, ans);
    if (result.output) s.lines.push({ cls: result.ok ? 'out' : 'bad', text: result.output });
    s.lines.push({ cls: 'bad', text: '↷ skipped — the answer (run for you): ' + ans });
    s.skipped = (s.skipped || 0) + 1;
    s.i++; s.attempts = 0; s.hintLevel = 0;
    if (s.i >= s.steps.length) { finishRun(); return; }
    renderStep();
  };
  document.getElementById('quit-btn').onclick = function () { session = null; renderHome(); };

  var hist = s.history || (s.history = []);
  var hi = hist.length;
  input.onkeydown = function (e) {
    if (e.key === 'ArrowUp') { if (hi > 0) { hi--; input.value = hist[hi]; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hi < hist.length - 1) { hi++; input.value = hist[hi]; } else { hi = hist.length; input.value = ''; } e.preventDefault(); }
    else if (e.key === 'Enter') {
      var cmd = input.value.trim();
      if (!cmd) return;
      hist.push(cmd); hi = hist.length;
      submit(cmd);
    }
  };
}

function submit(cmd) {
  var s = session;
  var step = currentStep();
  s.lines.push({ cls: 'in', prompt: promptFor(s.state), text: cmd });
  var result = engine.runCommand(s.state, cmd);
  if (result.output) s.lines.push({ cls: result.ok ? 'out' : 'bad', text: result.output });

  if (s.kind === 'sandbox' || !step) { renderStep(); return; }

  if (step.check(s.state, result, cmd)) {
    if (s.attempts === 0 && s.hintLevel === 0) s.firstTry++;
    s.lines.push({ cls: 'good', text: '✓ correct — ' + step.answer(getOS()) });
    s.i++; s.attempts = 0; s.hintLevel = 0;
    if (s.i >= s.steps.length) { finishRun(); return; }
    renderStep();
  } else {
    s.attempts++;
    if (result.ok) s.lines.push({ cls: 'bad', text: '✗ that ran, but it isn’t what the task asked — check the task again' + (s.attempts >= 2 ? ' (or take a hint)' : '') });
    renderStep();
  }
}

function finishRun() {
  var s = session;
  var p = getProgress();
  var scorePct = Math.round((s.firstTry / s.steps.length) * 100);
  var skippedNote = s.skipped ? ' (' + s.skipped + ' skipped — worth redoing those)' : '';
  var html;
  if (s.kind === 'guided') {
    p[s.mod.id] = p[s.mod.id] || {}; p[s.mod.id].guided = true; setProgress(p);
    html = '<h2>Module complete ✓</h2><p>' + s.firstTry + ' of ' + s.steps.length + ' first try' + skippedNote + '.</p>' +
      '<p>Now do the <strong>recap round</strong> — same commands, new paths, from memory.</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn" id="next-recap">Start recap</button>' +
      '<button class="btn ghost" id="back-home">Menu</button></div>';
  } else if (s.kind === 'recap') {
    p[s.mod.id] = p[s.mod.id] || {}; p[s.mod.id].recap = true; setProgress(p);
    html = '<h2>Recap done ✓</h2><p>' + s.firstTry + ' of ' + s.steps.length + ' first try' + skippedNote + '. These commands are getting into your fingers.</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn ghost" id="back-home">Menu</button></div>';
  } else { // exam
    if (p.examBest == null || scorePct > p.examBest) p.examBest = scorePct;
    setProgress(p);
    html = '<h2>Exam finished</h2><div class="big">' + scorePct + '%</div>' +
      '<p>' + s.firstTry + ' of ' + s.steps.length + ' on the first try' + skippedNote +
      (scorePct >= 80 ? ' — you are ready for tomorrow.' : ' — run it again; repetition is the whole point.') + '</p>' +
      '<div class="btnrow" style="justify-content:center"><button class="btn" id="redo-exam">Run it again</button>' +
      '<button class="btn ghost" id="back-home">Menu</button></div>';
  }
  var mod = s.mod;
  session = null;
  app.innerHTML = headerHTML() + '<div class="summary">' + html + '</div>';
  bindHeader();
  var bh = document.getElementById('back-home');
  if (bh) bh.onclick = function () { renderHome(); };
  var nr = document.getElementById('next-recap');
  if (nr) nr.onclick = function () { startRun('recap', mod); };
  var re = document.getElementById('redo-exam');
  if (re) re.onclick = function () { startRun('exam', null); };
}

// ---------- ?test=1 smoke suite ----------

function runSmokeTests() {
  var out = [];
  var pass = 0, fail = 0;
  ['linux', 'mac', 'windows'].forEach(function (os) {
    lessons.MODULES.forEach(function (m) {
      var state = m.setup(engine, os);
      m.steps.forEach(function (step, i) {
        var input = step.answer(os);
        var result = engine.runCommand(state, input);
        var okk = false;
        try { okk = step.check(state, result, input); } catch (e) { okk = false; }
        if (okk) { pass++; } else { fail++; out.push('<span class="f">FAIL ' + os + ' ' + m.id + ' step ' + i + ': ' + esc(input) + '</span>'); }
      });
    });
    var ex = lessons.examSetup(engine, os);
    lessons.buildExam().forEach(function (step, i) {
      var input = step.answer(os);
      var result = engine.runCommand(ex, input);
      if (step.check(ex, result, input)) pass++; else { fail++; out.push('<span class="f">FAIL ' + os + ' exam step ' + i + '</span>'); }
    });
  });
  out.unshift('<span class="' + (fail ? 'f' : 'p') + '">' + pass + ' passed, ' + fail + ' failed</span>');
  app.innerHTML = headerHTML() + '<div class="testlog">' + out.join('\n') + '</div>';
  bindHeader();
  console.log('[bdal4 smoke] pass=' + pass + ' fail=' + fail);
}

// ---------- boot ----------

if (location.search.indexOf('test=1') !== -1) runSmokeTests();
else if (getOS()) renderHome();
